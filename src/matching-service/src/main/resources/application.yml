server:
  port: 8084
  # N02 (T07-2): mặc định bind loopback — không mở cổng ra LAN; container hóa (T29) đặt
  # SERVER_ADDRESS=0.0.0.0 và publish port CHỈ 127.0.0.1 (dev/debug — health links demo, xem compose).
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: matching-service
  # T14 — RabbitMQ consumer (events.md §1/§4): inbox matching.inbox, manual ACK, DLQ.
  # Connection factory lazy — broker down lúc khởi động KHÔNG chặn app; listener container
  # tự retry kết nối ở nền cho tới khi broker lên lại (đã kiểm chứng trên spring-rabbit 4.1.1).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:ridehailing_dev}
    # N09: không có giá trị mặc định cho mật khẩu — thiếu env thì RequiredDbPasswordValidator dừng startup.
    password: ${RABBITMQ_PASSWORD}
  datasource:
    # T29: DB_HOST env (compose đặt postgres; mặc định localhost giữ hành vi chạy local).
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/matching_db
    username: matching_svc
    # N09 fix: KHÔNG có dev default — thiếu env thì service dừng với thông báo nêu tên biến.
    password: ${MATCHING_DB_PASSWORD}
    # N17 (C06): fail-fast kết nối DB (mặc định 30 s) — phối hợp với retry Flyway lúc khởi động.
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: 2000
      # N17 (C06): validate thật bằng round-trip khi checkout — readiness phản ánh đúng trạng thái DB
      # (pool ấm không tự phát hiện kết nối chết nếu chỉ dựa vào isValid()).
      connection-test-query: SELECT 1

# T14 — inbox consumer (events.md §4): dedup unique (consumer_name, event_id), ACK sau commit;
# transient failure retry in-process có giới hạn với backoff rồi reject(requeue=false) → DLQ.
app:
  inbox:
    consumer-name: matching-service # thành phần dedup — mỗi service một tên riêng (§4.1)
    max-retries: 3                  # số lần retry sau attempt đầu tiên fail (tổng tối đa 4 execution)
    retry-backoff-ms: 1000,3000,10000
  # T15 — matching job thật (spec §20.4): gọi internal API candidates driver-service (contract §4.2)
  # và phát DriverProposed/NoDriverFound qua outbox (§3.2/§3.3).
  matching:
    driver-service-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    # N08/N09: không có giá trị mặc định — thiếu env thì RequiredDbPasswordValidator dừng startup.
    internal-api-token: ${INTERNAL_API_TOKEN}
    radius-m: ${MATCHING_RADIUS_M:5000}          # contract §4.2 default
    max-candidates: ${MATCHING_MAX_CANDIDATES:5}  # contract §6 env table
    http-timeout-ms: ${MATCHING_HTTP_TIMEOUT_MS:3000}
  # T15 — outbox producer matching-service (events.md §4.6, pattern trip T13).
  outbox:
    enabled: true
    batch-size: 10
    confirm-timeout-ms: 5000
    publish-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      # T14: broker KHÔNG nằm trong /actuator/health — readiness chỉ phản ánh DB (như trip T13);
      # broker down không được làm service DOWN.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true # N17 (C06): /actuator/health/liveness + /readiness cho container orchestration.
      group:
        readiness:
          # N17 (C06): Boot 4 mặc định readiness KHÔNG gồm db — thêm tường minh để
          # /actuator/health/readiness DOWN (503) khi DB down, UP khi DB up.
          include: db

logging:
  level:
    root: info
