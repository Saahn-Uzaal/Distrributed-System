# DS03 — Nginx (T08): phục vụ frontend build + proxy /api/* tới services.
# Routes theo contract api-contracts.md §3: /api/auth → identity :8081,
# /api/drivers → driver :8082, /api/trips + /api/notifications → trip :8083.
# Dev mode: backend chạy là tiến trình Java local trên host → reachable qua
# host.docker.internal CHỈ KHI SERVER_ADDRESS=0.0.0.0 (mặc định 127.0.0.1 — N02;
# xem README "Dev mode & gateway" và comment trong deploy/compose.yaml).
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # T08-7 (N05): không lộ phiên bản Nginx trong header Server.
    server_tokens off;

    # spec §11 + contract §1: request body tối đa 64 KiB, vượt trả 413 PAYLOAD_TOO_LARGE.
    client_max_body_size 64k;

    # T08-1 (N01): rate limit cho TOÀN BỘ /api/auth/ (zone auth_limit), riêng login
    # giới hạn chặt hơn bằng zone login_limit (spec §11: 5r/s). Trước đó chỉ có
    # `location = /api/auth/login` bị limit → `/api/auth/login;x` rơi vào location
    # không limit và bỏ qua rate limit.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # T08-6 (N06): rate-limit rejection trả 429 RATE_LIMITED (thay vì 503 mặc định).
    limit_req_status 429;

    # T08-8 (N12): correlation ID — giữ UUID hợp lệ do client gửi, nếu không thì sinh.
    # Build nginx này KHÔNG có --with-http_request_id_module ($request_id_uuid không
    # tồn tại) -> tổng hợp pseudo-UUID từ các biến số: $msec + $connection +
    # $request_length + $remote_port (số thập phân cũng là hex hợp lệ). Service phía
    # backend (CorrelationIdFilter) parse thành UUID và echo lại đúng giá trị đó,
    # nên access log Nginx và log service khớp end-to-end (contract §5).
    map $msec $cid_msec_digits {
        '~^([0-9]+)\.([0-9]+)$' $1$2;
        default 0;
    }
    map "$cid_msec_digits$connection" $cid_seed1 {
        default $cid_msec_digits$connection;
    }
    map "$cid_seed1$request_length-$remote_port" $cid_seed2 {
        '~^([0-9]+)-([0-9]+)$' $1$2;
        default 0;
    }
    # Nhân đôi seed để đảm bảo >= 32 chữ số, lấy 32 đầu.
    map "$cid_seed2$cid_seed2" $cid_hex32 {
        '~^([0-9]{32}).*$' $1;
        default 00000000000000000000000000000000;
    }
    map $cid_hex32 $gen_cid {
        '~^([0-9]{8})([0-9]{4})([0-9]{4})([0-9]{4})([0-9]{12})$' $1-$2-$3-$4-$5;
        default 00000000-0000-0000-0000-000000000000;
    }

    map $http_x_correlation_id $cid {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $http_x_correlation_id;
        default $gen_cid;
    }

    # access log KHÔNG chứa request headers (Authorization không bao giờ được ghi) — spec §11 "không log token".
    # T08-8: thêm correlation ID vào access log.
    log_format main '$time_iso8601 "$request" $status cid=$cid';
    access_log /var/log/nginx/access.log main;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # T08-1 (N01): chặn URI chứa `;` hoặc `%3B` ở cấp server → 400.
        # Matrix parameter (`/api/auth/login;x`) trước đó lọt qua location exact-match
        # và bỏ qua limit_req; backend (Spring Security firewall) cũng từ chối tương tự (T07-1).
        if ($request_uri ~* "(;|%3b)") { return 400; }

        # spec §11: timeout HTTP connect 1s, read 3s
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;

        # T08-3 (F22): lỗi upstream 502/503/504 trả JSON theo contract §1.2 (không HTML).
        error_page 502 = @json_502;
        error_page 503 = @json_503;
        error_page 504 = @json_504;

        location @json_502 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid"}';
        }

        location @json_503 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid"}';
        }

        location @json_504 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 504 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid"}';
        }

        # T08-6 (N06): rate limit → 429 RATE_LIMITED JSON (contract §1.2).
        error_page 429 = @json_rate_limited;
        location @json_rate_limited {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Try again later.","correlationId":"$cid"}';
        }

        # T08-4 (F23): 413 JSON với correlation ID (giữ/sinh theo T08-8) + header —
        # thay file tĩnh web/public/errors/payload-too-large.json.
        error_page 413 = @json_payload_too_large;
        location @json_payload_too_large {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Request body too large (max 64 KiB).","correlationId":"$cid"}';
        }

        # T08-2 (N04): location có ranh giới — exact match + prefix KÈM slash cuối.
        # `/api/authx`, `/api/tripsfoo`... không còn được proxy sang backend;
        # mọi path /api/* không khớp route rơi vào 404 JSON theo T08-5 bên dưới.
        # R01 fix: giữ URI chính xác (/api/trips, /api/notifications...) và subpath
        # được proxy nguyên request (giữ method/body/URI theo contract), không sinh 301.
        location = /api/auth {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        # login rate limit (spec §11) — zone riêng, chặt hơn phần còn lại của /api/auth/
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/drivers {
            proxy_pass http://host.docker.internal:8082/api/drivers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/drivers/ {
            proxy_pass http://host.docker.internal:8082/api/drivers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/trips {
            proxy_pass http://host.docker.internal:8083/api/trips;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/trips/ {
            proxy_pass http://host.docker.internal:8083/api/trips/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/notifications {
            proxy_pass http://host.docker.internal:8083/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/notifications/ {
            proxy_pass http://host.docker.internal:8083/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        # T08-5 (F24): path /api/* không khớp route → 404 JSON (không rơi SPA fallback HTML).
        location = /api {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 404 '{"code":"NOT_FOUND","message":"API route not found.","correlationId":"$cid"}';
        }

        location /api/ {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 404 '{"code":"NOT_FOUND","message":"API route not found.","correlationId":"$cid"}';
        }

        # SPA fallback — React Router xử lý client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
