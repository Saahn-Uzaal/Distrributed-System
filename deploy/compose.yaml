# DS03 — local infrastructure (T04: PostgreSQL riêng quyền + RabbitMQ; T08: Nginx)
# + T29: 5 backend services containerized từ MỘT image dùng chung (deploy/docker/Dockerfile.backend)
#   và frontend build vào nginx image (deploy/docker/Dockerfile.web).
# Chạy toàn hệ thống: docker compose --env-file .env -f deploy/compose.yaml up --build -d
# (clean checkout cần scripts/generate-dev-keys.sh trước — keys/*.pem gitignored, bind-mount vào service cần key.)
name: ridehailing

services:
  postgres:
    # F32 fix: pin patch version đầy đủ (postgres:17.11-alpine = psql 17.11) — không trôi theo tag minor.
    image: postgres:17.11-alpine
    container_name: ridehailing-postgres
    restart: unless-stopped
    environment:
      # Admin chỉ dùng cho init/debug — KHÔNG phải tài khoản của service nào
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Mật khẩu 5 tài khoản service (init script đọc từ đây)
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bind localhost only (debug) — spec mục 12
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # N18 fix: healthy CHỈ sau khi init script tạo xong DB/user — kiểm tra qua TCP bằng tài khoản
    # service (payment_svc) trên payment_db (DB tạo cuối cùng trong init); pg_isready sớm
    # (server tạm của docker-entrypoint) không đủ.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $${POSTGRES_USER} && PGPASSWORD=$$PAYMENT_DB_PASSWORD psql -h 127.0.0.1 -U payment_svc -d payment_db -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [backend]

  rabbitmq:
    # F32 fix: pin đúng patch khớp record framing đã chép trong declare_topology.es (RabbitMQ 3.13.7).
    image: rabbitmq:3.13.7-management-alpine
    container_name: ridehailing-rabbitmq
    restart: unless-stopped
    environment:
      # Dev-only credentials từ .env (spec mục 9/12)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Bind localhost only cho dev — spec mục 12
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      # Dữ liệu broker (queues, messages persistent) giữ sau restart — spec mục 9/12
      - rabbitmq_data:/var/lib/rabbitmq
    # ping (distribution) có thể pass TRƯỚC khi listener AMQP 5672 sẵn sàng — thêm nc -z
    # để healthy chỉ khi port AMQP thật sự nhận kết nối (tránh race với topo-declare).
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && nc -z 127.0.0.1 5672"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [backend]

  # T29 — identity-service (port 8081). Cùng image backend cho cả 5 services; command riêng.
  identity-service:
    # Chỉ service này build image dùng chung: cả 5 service cùng build một tag sẽ xung đột khi build song song
    # ("image already exists" trên Docker Linux). 4 service còn lại dùng lại image, không kéo từ registry.
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.backend
    image: ridehailing-backend:0.1.0
    container_name: ridehailing-identity-service
    restart: unless-stopped
    command: java -jar /app/identity-service.jar
    # Key private mode 600 thuộc user host: Linux đặt HOST_UID/HOST_GID để đọc được (.env.example).
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes:
      # Long syntax: thiếu file thì compose báo lỗi, không tự tạo thư mục rỗng.
      # Private key CHỈ ở identity-service (spec §11) — service khác không giả được token.
      - type: bind
        source: ../keys/jwt-private.pem
        target: /app/keys/jwt-private.pem
        read_only: true
      - type: bind
        source: ../keys/jwt-public.pem
        target: /app/keys/jwt-public.pem
        read_only: true
    environment:
      # N02/T29: bind 0.0.0.0 TRONG container (nginx proxy tới DNS service); publish CHỈ 127.0.0.1 bên dưới.
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    ports:
      # Dev/debug only — health links demo từ host browser; KHÔNG mở ra LAN, không expose qua nginx :8080.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    # N17/C06: readiness gồm DB — healthy thật sau khi Flyway migrate xong và DB reachable.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  # T29 — driver-service (port 8082).
  driver-service:
    image: ridehailing-backend:0.1.0
    pull_policy: never
    container_name: ridehailing-driver-service
    restart: unless-stopped
    command: java -jar /app/driver-service.jar
    volumes:
      - type: bind
        source: ../keys/jwt-public.pem
        target: /app/keys/jwt-public.pem
        read_only: true
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RESERVATION_EXPIRY_ENABLED: ${RESERVATION_EXPIRY_ENABLED:-true}
      RESERVATION_EXPIRY_FIXED_DELAY_MS: ${RESERVATION_EXPIRY_FIXED_DELAY_MS:-1000}
    ports:
      # Dev/debug only — health links demo từ host browser; KHÔNG mở ra LAN, không expose qua nginx :8080.
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  # T29 — trip-service (port 8083). Gọi driver-service qua DNS compose.
  trip-service:
    image: ridehailing-backend:0.1.0
    pull_policy: never
    container_name: ridehailing-trip-service
    restart: unless-stopped
    command: java -jar /app/trip-service.jar
    volumes:
      - type: bind
        source: ../keys/jwt-public.pem
        target: /app/keys/jwt-public.pem
        read_only: true
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD}
      FARE_BASE_VND: ${FARE_BASE_VND:-12000}
      FARE_PER_KM_VND: ${FARE_PER_KM_VND:-5000}
      TRIP_MATCH_DEADLINE_SECONDS: ${TRIP_MATCH_DEADLINE_SECONDS:-120}
      # T29: broker qua DNS compose (mặc định yml là localhost — KHÔNG đúng trong container).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DRIVER_SERVICE_URL: http://driver-service:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      # Dev/debug only — health links demo từ host browser; KHÔNG mở ra LAN, không expose qua nginx :8080.
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  # T29 — matching-service (port 8084). Gọi driver-service qua DNS compose.
  matching-service:
    image: ridehailing-backend:0.1.0
    pull_policy: never
    container_name: ridehailing-matching-service
    restart: unless-stopped
    command: java -jar /app/matching-service.jar
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD}
      # T29: broker qua DNS compose (mặc định yml là localhost — KHÔNG đúng trong container).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DRIVER_SERVICE_URL: http://driver-service:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      # Dev/debug only — health links demo từ host browser; KHÔNG mở ra LAN, không expose qua nginx :8080.
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  # T29 — payment-service (port 8085).
  payment-service:
    image: ridehailing-backend:0.1.0
    pull_policy: never
    container_name: ridehailing-payment-service
    restart: unless-stopped
    command: java -jar /app/payment-service.jar
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      # 0 = luôn thành công; 1 = luôn decline — đổi để demo payment FAILED.
      PAYMENT_SIMULATE_FAIL_RATE: ${PAYMENT_SIMULATE_FAIL_RATE:-0}
      # T29: broker qua DNS compose (mặc định yml là localhost — KHÔNG đúng trong container).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      # Dev/debug only — health links demo từ host browser; KHÔNG mở ra LAN, không expose qua nginx :8080.
      - "127.0.0.1:8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  # T29 — Nginx: frontend build + proxy conf BAKE vào image (deploy/docker/Dockerfile.web).
  # Proxy /api/* sang DNS tên service compose (identity-service/driver-service/trip-service) —
  # không còn host.docker.internal hay bind-mount dist. Public port duy nhất của hệ thống: 8080.
  nginx:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
    image: ridehailing-web:0.1.0
    container_name: ridehailing-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    # service_started (không chờ healthy): gateway lên sớm và trả JSON 502 thay vì không có gì
    # trong lúc backend khởi động; upstream `resolve` trong nginx.conf tự cập nhật khi đổi IP.
    depends_on:
      identity-service:
        condition: service_started
      driver-service:
        condition: service_started
      trip-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # T04 (+N15): declare RabbitMQ topology TỰ ĐỘNG sau khi broker healthy — one-shot container.
  # Mỗi lần `docker compose up` (kể cả sau `down -v`) container tạo mới và chạy lại script,
  # nên reset volume broker KHÔNG cần chạy tay. Script thủ công vẫn giữ làm công cụ phụ.
  topo-declare:
    image: rabbitmq:3.13.7-management-alpine   # F32: cùng tag pin với broker
    container_name: ridehailing-topo-declare
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Image rabbitmq mặc định đặt RABBITMQ_HOST=false — phải set tường minh tên service.
      RABBITMQ_HOST: rabbitmq
      ERL_LIBS: /opt/rabbitmq/plugins
    volumes:
      - ./rabbitmq:/topo:ro
    command: escript /topo/declare_topology.es
    networks: [backend]

volumes:
  pgdata:
  rabbitmq_data:

networks:
  # Mạng chung cho infra + services — DNS theo tên service (T29).
  backend:
    name: ridehailing_net
