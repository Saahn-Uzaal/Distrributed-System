server:
  port: 8083
  # N02 (T07-2): mặc định bind loopback — không mở cổng ra LAN; container hóa (T29) đặt SERVER_ADDRESS=0.0.0.0 nhưng không publish port.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: trip-service
  # T13 — RabbitMQ (events.md §1/§4.6): outbox worker publish persistent + confirms.
  # Connection factory lazy — broker down lúc khởi động KHÔNG chặn app (T13 acceptance:
  # "broker down vẫn giữ pending; broker lại lên phát được").
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:ridehailing_dev}
    # N09: không có giá trị mặc định cho mật khẩu — thiếu env thì RequiredDbPasswordValidator dừng startup.
    password: ${RABBITMQ_PASSWORD:}
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/trip_db
    username: trip_svc
    # N09 fix: KHÔNG có dev default — thiếu env thì service dừng với thông báo nêu tên biến.
    password: ${TRIP_DB_PASSWORD}
    # N17 (C06): fail-fast kết nối DB (mặc định 30 s) — phối hợp với retry Flyway lúc khởi động.
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: 2000
      # N17 (C06): validate thật bằng round-trip khi checkout — readiness phản ánh đúng trạng thái DB
      # (pool ấm không tự phát hiện kết nối chết nếu chỉ dựa vào isValid()).
      connection-test-query: SELECT 1

# T07 — security (contract api-contracts.md §1/§2): verify JWT RS256 bằng public key.
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}

# T12 — fare server-side (contract api-contracts.md §3.3):
# fareVnd = FARE_BASE_VND + ceil(distanceM/1000) * FARE_PER_KM_VND.
fare:
  base-vnd: ${FARE_BASE_VND:12000}
  per-km-vnd: ${FARE_PER_KM_VND:5000}

# T13 — outbox publish worker (events.md §4.6): quét PENDING, publish + chờ confirm rồi đánh dấu SENT;
# returned/lỗi transient -> giữ PENDING + last_error + backoff next_attempt_at.
app:
  outbox:
    enabled: true
    publish-interval-ms: 1000
    batch-size: 10
    confirm-timeout-ms: 5000
  # T16 — inbox consumer (events.md §4): dedup + retry bounded khi transient fail.
  inbox:
    consumer-name: trip-service
    max-retries: 3
    # Backoff mặc định production 1s/3s/10s; test đặt giá trị ngắn hơn qua property trực tiếp.
    retry-backoff-ms: ${TRIP_INBOX_RETRY_BACKOFF_MS:1000,3000,10000}
  # T21 — saga recovery worker (state-machines.md §2 "Quy tắc worker"): quét saga chưa terminal có
  # next_retry_at đến hạn, claim bằng transaction ngắn (CAS version + lease_owner), thực thi intent
  # pending ngoài khóa DB. Lease re-arm khi claim: worker chết giữa chừng → replay idempotent sau hết hạn.
  saga:
    enabled: true
    worker-interval-ms: ${SAGA_WORKER_INTERVAL_MS:1000}
    lease-ms: ${SAGA_LEASE_MS:5000}
    batch-size: 5
  # T16 — internal API driver-service (api-contracts.md §4.2/§7-8) + matching policy
  # (events.md §3.2/§3.3, api-contracts.md §6).
  trip:
    driver-service-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    # N09: KHÔNG có dev default — thiếu env thì RequiredDbPasswordValidator dừng startup.
    internal-api-token: ${INTERNAL_API_TOKEN}
    http-timeout-ms: ${TRIP_HTTP_TIMEOUT_MS:3000}
    offer-ttl-seconds: ${OFFER_TTL_SECONDS:30}
    max-matching-attempts: ${MAX_MATCHING_ATTEMPTS:3}
    matching-retry-delay-ms: ${MATCHING_RETRY_DELAY_MS:5000}
    trip-match-deadline-seconds: ${TRIP_MATCH_DEADLINE_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      # T13: broker KHÔNG nằm trong /actuator/health — readiness chỉ phản ánh DB (N17/C06);
      # broker down không được làm service DOWN (T13 acceptance: app vẫn chạy + giữ pending).
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true # N17 (C06): /actuator/health/liveness + /readiness cho container orchestration.
      group:
        readiness:
          # N17 (C06): Boot 4 mặc định readiness KHÔNG gồm db — thêm tường minh để
          # /actuator/health/readiness DOWN (503) khi DB down, UP khi DB up.
          include: db

logging:
  level:
    root: info
