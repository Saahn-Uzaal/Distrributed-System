# T34 — CI (spec §4, §20.6): build/test backend + frontend, rồi chạy hệ thống thật từ checkout sạch.
# Test thiếu môi trường không được tính là pass: scripts/ci-test-report.sh fail nếu có test bị skip hoặc không có report.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan tracked secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/scan-tracked-secrets.sh

  backend:
    name: Backend build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + test (Testcontainers dùng Docker của runner)
        run: ./mvnw -B clean verify
      - name: Báo cáo test (fail nếu skip hoặc thiếu report)
        if: always()
        run: ./scripts/ci-test-report.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: src/*/target/surefire-reports/*.xml
          if-no-files-found: warn

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  system:
    name: Clean deploy + system tests
    runs-on: ubuntu-24.04
    needs: [secrets, backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Deploy từ checkout sạch, smoke + security (S01/S02/S03)
        run: ./scripts/ci-system-check.sh --keep
      - name: E2E UI trên headless Chrome (có sẵn trên runner ubuntu-24.04)
        working-directory: tests/e2e
        run: |
          npm ci
          ../../scripts/reset-demo.sh --confirm
          SEED_PASSWORD="$(sed -n 's/^SEED_PASSWORD=//p' ../../.env)"
          export SEED_PASSWORD
          node ui-flow.cjs "$(command -v google-chrome)" "$RUNNER_TEMP"
      - name: Log container khi lỗi
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-results
          path: tests/security/
          if-no-files-found: warn
      - name: Dọn dẹp
        if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down -v
