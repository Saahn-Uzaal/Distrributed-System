server:
  port: 8085
  # N02 (T07-2): mặc định bind loopback — không mở cổng ra LAN; container hóa (T29) đặt
  # SERVER_ADDRESS=0.0.0.0 và publish port CHỈ 127.0.0.1 (dev/debug — health links demo, xem compose).
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: payment-service
  # T23 — RabbitMQ consumer (events.md §1/§4): inbox payment.inbox, manual ACK, DLQ.
  # Connection factory lazy — broker down lúc khởi động KHÔNG chặn app; listener container
  # tự retry kết nối ở nền cho tới khi broker lên lại (đã kiểm chứng trên spring-rabbit 4.1.1).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:ridehailing_dev}
    # N09: không có giá trị mặc định cho mật khẩu — thiếu env thì kết nối broker thất bại,
    # listener retry ở nền; app vẫn khởi động (broker không nằm trong readiness).
    password: ${RABBITMQ_PASSWORD}
  datasource:
    # T29: DB_HOST env (compose đặt postgres; mặc định localhost giữ hành vi chạy local).
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/payment_db
    username: payment_svc
    # N09 fix: KHÔNG có dev default — thiếu env thì service dừng với thông báo nêu tên biến.
    password: ${PAYMENT_DB_PASSWORD}
    # N17 (C06): fail-fast kết nối DB (mặc định 30 s) — phối hợp với retry Flyway lúc khởi động.
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: 2000
      # N17 (C06): validate thật bằng round-trip khi checkout — readiness phản ánh đúng trạng thái DB
      # (pool ấm không tự phát hiện kết nối chết nếu chỉ dựa vào isValid()).
      connection-test-query: SELECT 1

# T23 — inbox consumer (events.md §4): dedup unique (consumer_name, event_id), ACK sau commit;
# transient failure retry in-process có giới hạn với backoff rồi reject(requeue=false) → DLQ.
app:
  inbox:
    consumer-name: payment-service # thành phần dedup — mỗi service một tên riêng (§4.1)
    max-retries: 3                  # số lần retry sau attempt đầu tiên fail (tổng tối đa 4 execution)
    retry-backoff-ms: 1000,3000,10000
    # R02 (spec §13): failpoint test-only — sleep giữa DB commit và ACK; mặc định 0 = tắt.
    # Bật qua env APP_INBOX_FAILPOINT_DELAY_MS CHỈ trong kịch bản scripts/recovery-r02.sh,
    # không dùng production (fault injection chỉ bật bằng profile/env test).
    failpoint-delay-ms: ${APP_INBOX_FAILPOINT_DELAY_MS:0}
  # T23 — outbox producer payment-service (events.md §4.6, pattern trip T13/matching T15).
  outbox:
    enabled: true
    batch-size: 10
    confirm-timeout-ms: 5000
    publish-interval-ms: 1000
  # T23 — simulate success/failure cấu hình dev (spec §20.5): xác suất decline giả lập.
  # 0 = luôn thành công; 1 = luôn decline; env PAYMENT_SIMULATE_FAIL_RATE cho demo/dev.
  payment:
    simulate-fail-rate: ${PAYMENT_SIMULATE_FAIL_RATE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      # T23: broker KHÔNG nằm trong /actuator/health — readiness chỉ phản ánh DB (như trip T13);
      # broker down không được làm service DOWN.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true # N17 (C06): /actuator/health/liveness + /readiness cho container orchestration.
      group:
        readiness:
          # N17 (C06): Boot 4 mặc định readiness KHÔNG gồm db — thêm tường minh để
          # /actuator/health/readiness DOWN (503) khi DB down, UP khi DB up.
          include: db

logging:
  level:
    root: info
