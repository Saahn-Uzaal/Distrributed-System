# DS03 — Nginx (T08): phục vụ frontend build + proxy /api/* tới services.
# Routes theo contract api-contracts.md §3: /api/auth → identity :8081,
# /api/drivers → driver :8082, /api/trips + /api/notifications → trip :8083.
# Dev mode: backend chạy là tiến trình Java local trên host → reachable qua
# host.docker.internal CHỈ KHI SERVER_ADDRESS=0.0.0.0 (mặc định 127.0.0.1 — N02;
# xem README "Dev mode & gateway" và comment trong deploy/compose.yaml).
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # spec §11 + contract §1: request body tối đa 64 KiB, vượt trả 413 PAYLOAD_TOO_LARGE.
    client_max_body_size 64k;

    # T08-1 (N01): rate limit cho TOÀN BỘ /api/auth/ (zone auth_limit), riêng login
    # giới hạn chặt hơn bằng zone login_limit (spec §11: 5r/s). Trước đó chỉ có
    # `location = /api/auth/login` bị limit → `/api/auth/login;x` rơi vào location
    # không limit và bỏ qua rate limit.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # access log KHÔNG chứa request headers (Authorization không bao giờ được ghi) — spec §11 "không log token"
    log_format main '$time_iso8601 "$request" $status';
    access_log /var/log/nginx/access.log main;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # T08-1 (N01): chặn URI chứa `;` hoặc `%3B` ở cấp server → 400.
        # Matrix parameter (`/api/auth/login;x`) trước đó lọt qua location exact-match
        # và bỏ qua limit_req; backend (Spring Security firewall) cũng từ chối tương tự (T07-1).
        if ($request_uri ~* "(;|%3b)") { return 400; }

        # spec §11: timeout HTTP connect 1s, read 3s
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;

        # T08-2 (N04): location có ranh giới — exact match + prefix KÈM slash cuối.
        # `/api/authx`, `/api/tripsfoo`... không còn được proxy sang backend
        # (rơi vào SPA fallback; JSON 404 đầy đủ theo T08-5).
        # R01 fix: giữ URI chính xác (/api/trips, /api/notifications...) và subpath
        # được proxy nguyên request (giữ method/body/URI theo contract), không sinh 301.
        location = /api/auth {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # login rate limit (spec §11) — zone riêng, chặt hơn phần còn lại của /api/auth/
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8081/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/drivers {
            proxy_pass http://host.docker.internal:8082/api/drivers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/drivers/ {
            proxy_pass http://host.docker.internal:8082/api/drivers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/trips {
            proxy_pass http://host.docker.internal:8083/api/trips;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/trips/ {
            proxy_pass http://host.docker.internal:8083/api/trips/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/notifications {
            proxy_pass http://host.docker.internal:8083/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/notifications/ {
            proxy_pass http://host.docker.internal:8083/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # R07 fix: 413 trả JSON theo contract §1.2 (file tĩnh trong web/public -> dist).
        # Giới hạn ở Nginx không thể echo/tạo correlationId — ghi nhận là limitation;
        # mọi lỗi ứng dụng vẫn mang correlationId đầy đủ.
        error_page 413 /errors/payload-too-large.json;

        # SPA fallback — React Router xử lý client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
