server:
  port: 8085
  # N02 (T07-2): mặc định bind loopback — không mở cổng ra LAN; container hóa (T29) đặt SERVER_ADDRESS=0.0.0.0 nhưng không publish port.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/payment_db
    username: payment_svc
    # N09 fix: KHÔNG có dev default — thiếu env thì service dừng với thông báo nêu tên biến.
    password: ${PAYMENT_DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
