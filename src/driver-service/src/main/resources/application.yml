server:
  port: 8082
  # N02 (T07-2): mặc định bind loopback — không mở cổng ra LAN; container hóa (T29) đặt
  # SERVER_ADDRESS=0.0.0.0 và publish port CHỈ 127.0.0.1 (dev/debug — health links demo, xem compose).
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: driver-service
  datasource:
    # T29: DB_HOST env (compose đặt postgres; mặc định localhost giữ hành vi chạy local).
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/driver_db
    username: driver_svc
    # N09 fix: KHÔNG có dev default — thiếu env thì service dừng với thông báo nêu tên biến.
    password: ${DRIVER_DB_PASSWORD}
    # N17 (C06): fail-fast kết nối DB (mặc định 30 s) — phối hợp với retry Flyway lúc khởi động.
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: 2000
      # N17 (C06): validate thật bằng round-trip khi checkout — readiness phản ánh đúng trạng thái DB
      # (pool ấm không tự phát hiện kết nối chết nếu chỉ dựa vào isValid()).
      connection-test-query: SELECT 1

# T07 — security (contract api-contracts.md §1/§2): verify JWT RS256 bằng public key;
# internal API credential X-Internal-Token = env INTERNAL_API_TOKEN (dev token dùng chung).
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
internal:
  api-token: ${INTERNAL_API_TOKEN:}

# T09 — candidates: heartbeat stale threshold (contract §4.2 chốt HEARTBEAT_STALE_AFTER_MS=15000)
driver:
  heartbeat-stale-after-ms: ${HEARTBEAT_STALE_AFTER_MS:15000}

reservation:
  expiry:
    enabled: ${RESERVATION_EXPIRY_ENABLED:true}
    fixed-delay-ms: ${RESERVATION_EXPIRY_FIXED_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # N17 (C06): /actuator/health/liveness + /readiness cho container orchestration.
      group:
        readiness:
          # N17 (C06): Boot 4 mặc định readiness KHÔNG gồm db — thêm tường minh để
          # /actuator/health/readiness DOWN (503) khi DB down, UP khi DB up.
          include: db

logging:
  level:
    root: info
