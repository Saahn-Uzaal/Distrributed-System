# DS03 — Nginx (T08 + T29): phục vụ frontend build + proxy /api/* tới services.
# Routes theo contract api-contracts.md §3: /api/auth → identity :8081,
# /api/drivers → driver :8082, /api/trips + /api/notifications → trip :8083.
# T29: backend containerized — proxy_pass sang upstream DNS tên service compose
# (identity-service/driver-service/trip-service trên network ridehailing_net).
# `resolve` + resolver của Docker: không crash khi backend chưa chạy, và theo IP mới khi container
# được recreate (proxy_pass tên trần chỉ resolve một lần lúc khởi động).
# Private routes (/actuator, /internal) KHÔNG lộ qua gateway :8080 — trả 404;
# health dev-only publish CHỈ 127.0.0.1:808x (compose) cho links demo.
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # T08-7 (N05): không lộ phiên bản Nginx trong header Server.
    server_tokens off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream identity_upstream {
        zone identity_upstream 64k;
        server identity-service:8081 resolve;
    }

    upstream driver_upstream {
        zone driver_upstream 64k;
        server driver-service:8082 resolve;
    }

    upstream trip_upstream {
        zone trip_upstream 64k;
        server trip-service:8083 resolve;
    }

    # spec §11 + contract §1: request body tối đa 64 KiB, vượt trả 413 PAYLOAD_TOO_LARGE.
    client_max_body_size 64k;

    # T08-1 (N01): rate limit cho TOÀN BỘ /api/auth/ (zone auth_limit), riêng login
    # giới hạn chặt hơn bằng zone login_limit (spec §11: 5r/s). Trước đó chỉ có
    # `location = /api/auth/login` bị limit → `/api/auth/login;x` rơi vào location
    # không limit và bỏ qua rate limit.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # T08-6 (N06): rate-limit rejection trả 429 RATE_LIMITED (thay vì 503 mặc định).
    limit_req_status 429;

    # T08-8 (N12) + L12: correlation ID — giữ UUID hợp lệ do client gửi, nếu không thì sinh.
    # $request_id là biến lõi của Nginx (>= 1.11): 32 ký tự hex ngẫu nhiên mỗi request.
    # Định dạng lại thành UUID 8-4-4-4-12 để CorrelationIdFilter của service chấp nhận nguyên giá trị,
    # nên access log Nginx và log service khớp end-to-end (contract §5).
    map $request_id $gen_cid {
        '~^([0-9a-f]{8})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{4})([0-9a-f]{12})$' $1-$2-$3-$4-$5;
        default 00000000-0000-0000-0000-000000000000;
    }

    map $http_x_correlation_id $cid {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $http_x_correlation_id;
        default $gen_cid;
    }

    # access log KHÔNG chứa request headers (Authorization không bao giờ được ghi) — spec §11 "không log token".
    # T08-8: thêm correlation ID vào access log.
    log_format main '$time_iso8601 "$request" $status cid=$cid';
    access_log /var/log/nginx/access.log main;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # T08-1 (N01): chặn URI chứa `;` hoặc `%3B` ở cấp server → 400.
        # Matrix parameter (`/api/auth/login;x`) trước đó lọt qua location exact-match
        # và bỏ qua limit_req; backend (Spring Security firewall) cũng từ chối tương tự (T07-1).
        if ($request_uri ~* "(;|%3b)") { return 400; }

        # spec §11: timeout HTTP connect 1s, read 3s
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;

        # T08-3 (F22): lỗi upstream 502/503/504 trả JSON theo contract §1.2 (không HTML).
        error_page 502 = @json_502;
        error_page 503 = @json_503;
        error_page 504 = @json_504;

        location @json_502 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid","details":null}';
        }

        location @json_503 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid","details":null}';
        }

        location @json_504 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 504 '{"code":"UPSTREAM_UNAVAILABLE","message":"Upstream service unavailable. Try again later.","correlationId":"$cid","details":null}';
        }

        # L04: 400 (gồm URL chứa ';' / %3B bị chặn ở trên) → JSON ApiError INVALID_INPUT, không trả HTML.
        error_page 400 = @json_400;
        location @json_400 {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 400 '{"code":"INVALID_INPUT","message":"Request URL contains characters that are not allowed.","correlationId":"$cid","details":null}';
        }

        # T08-6 (N06): rate limit → 429 RATE_LIMITED JSON (contract §1.2).
        error_page 429 = @json_rate_limited;
        location @json_rate_limited {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Try again later.","correlationId":"$cid","details":null}';
        }

        # T08-4 (F23): 413 JSON với correlation ID (giữ/sinh theo T08-8) + header —
        # thay file tĩnh web/public/errors/payload-too-large.json.
        error_page 413 = @json_payload_too_large;
        location @json_payload_too_large {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Request body too large (max 64 KiB).","correlationId":"$cid","details":null}';
        }

        # T08-2 (N04): location có ranh giới — exact match + prefix KÈM slash cuối.
        # `/api/authx`, `/api/tripsfoo`... không còn được proxy sang backend;
        # mọi path /api/* không khớp route rơi vào 404 JSON theo T08-5 bên dưới.
        # R01 fix: giữ URI chính xác (/api/trips, /api/notifications...) và subpath
        # được proxy nguyên request (giữ method/body/URI theo contract), không sinh 301.
        location = /api/auth {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://identity_upstream/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://identity_upstream/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        # login rate limit (spec §11) — zone riêng, chặt hơn phần còn lại của /api/auth/
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://identity_upstream/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/drivers {
            proxy_pass http://driver_upstream/api/drivers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/drivers/ {
            proxy_pass http://driver_upstream/api/drivers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/trips {
            proxy_pass http://trip_upstream/api/trips;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/trips/ {
            proxy_pass http://trip_upstream/api/trips/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location = /api/locations {
            proxy_pass http://trip_upstream/api/locations;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 8s;
            proxy_intercept_errors on;
        }

        location /api/locations/ {
            proxy_pass http://trip_upstream/api/locations/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 8s;
            proxy_intercept_errors on;
        }

        location = /api/notifications {
            proxy_pass http://trip_upstream/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        location /api/notifications/ {
            proxy_pass http://trip_upstream/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $cid;
        }

        # T08-5 (F24): path /api/* không khớp route → 404 JSON (không rơi SPA fallback HTML).
        location = /api {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 404 '{"code":"NOT_FOUND","message":"API route not found.","correlationId":"$cid","details":null}';
        }

        location /api/ {
            default_type application/json;
            add_header X-Correlation-ID $cid always;
            return 404 '{"code":"NOT_FOUND","message":"API route not found.","correlationId":"$cid","details":null}';
        }

        # T29 — private routes không lộ qua gateway :8080 (health/internal chỉ publish
        # 127.0.0.1 dev trong compose) — trả 404, KHÔNG rơi vào SPA fallback.
        location ^~ /actuator {
            return 404;
        }

        location ^~ /internal {
            return 404;
        }

        # SPA fallback — React Router xử lý client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
